naftiko: "1.0.0-alpha1"

info:
  label: "Upwork GraphQL API"
  description: "GraphQL API for job search, profiles, contracts, and messaging on the Upwork platform."
  tags:
    - Upwork
    - Freelancing
    - GraphQL
    - Jobs
    - Contracts
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      UPWORK_ACCESS_TOKEN: UPWORK_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: upwork-graphql
      baseUri: https://api.upwork.com
      description: "Upwork GraphQL API for marketplace data access"
      authentication:
        type: bearer
        token: "{{UPWORK_ACCESS_TOKEN}}"
      resources:
        - name: graphql
          path: /graphql
          description: "GraphQL endpoint for all queries and mutations"
          operations:
            - name: execute-graphql
              method: POST
              description: "Execute any GraphQL query, mutation, or subscription"
              inputParameters:
                - name: query
                  in: body
                  type: string
                  required: true
                  description: "GraphQL query string"
                - name: variables
                  in: body
                  type: object
                  required: false
                  description: "Query variables"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  query: "{{tools.query}}"
                  variables: "{{tools.variables}}"

        - name: jobs
          path: /api/v3/jobs/search
          description: "Job search and retrieval"
          operations:
            - name: search-jobs
              method: GET
              description: "Search for job postings on Upwork"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Search query string"
                - name: paging
                  in: query
                  type: string
                  required: false
                  description: "Pagination as offset;count"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-job
              method: GET
              description: "Get job details by ID"
              inputParameters:
                - name: job_id
                  in: path
                  type: string
                  required: true
                  description: "Job identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: contracts
          path: /api/v3/hr/v2/contracts
          description: "Contract management"
          operations:
            - name: list-contracts
              method: GET
              description: "List all contracts for the authenticated user"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-contract
              method: GET
              description: "Get contract details"
              inputParameters:
                - name: contract_id
                  in: path
                  type: string
                  required: true
                  description: "Contract identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: profiles
          path: /api/v3/profiles/v2/search/providers
          description: "Freelancer profile search"
          operations:
            - name: search-freelancers
              method: GET
              description: "Search for freelancers by skills and criteria"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Search query"
                - name: paging
                  in: query
                  type: string
                  required: false
                  description: "Pagination"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-freelancer-profile
              method: GET
              description: "Get a freelancer's profile"
              inputParameters:
                - name: user_id
                  in: path
                  type: string
                  required: true
                  description: "User identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: messages
          path: /api/v3/messages/v3/rooms
          description: "Contract messaging"
          operations:
            - name: list-messages
              method: GET
              description: "List messages in a contract room"
              inputParameters:
                - name: room_id
                  in: path
                  type: string
                  required: true
                  description: "Room identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: send-message
              method: POST
              description: "Send a message to a contract room"
              inputParameters:
                - name: room_id
                  in: path
                  type: string
                  required: true
                  description: "Room identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  message: "{{tools.message}}"

  exposes:
    - type: rest
      port: 8100
      namespace: upwork-graphql-rest
      resources:
        - path: /v1/jobs/search
          operations:
            - method: GET
              name: search-jobs
              call: "upwork-graphql.search-jobs"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/contracts
          operations:
            - method: GET
              name: list-contracts
              call: "upwork-graphql.list-contracts"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/freelancers/search
          operations:
            - method: GET
              name: search-freelancers
              call: "upwork-graphql.search-freelancers"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: upwork-graphql-mcp
      transport: http
      tools:
        - name: search-jobs
          description: "Search Upwork job postings"
          hints:
            readOnly: true
          call: "upwork-graphql.search-jobs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-contracts
          description: "List active contracts"
          hints:
            readOnly: true
          call: "upwork-graphql.list-contracts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-freelancers
          description: "Search for freelancers"
          hints:
            readOnly: true
          call: "upwork-graphql.search-freelancers"
          outputParameters:
            - type: object
              mapping: "$."
